name: Publish ReVive project page
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: >-
          python -m pip install mkdocs==1.6.1 mkdocs-material
          mkdocs-literate-nav mkdocs-section-index
          mkdocs-git-revision-date-localized-plugin
          mkdocs-git-authors-plugin "mkdocstrings[python]"
      - run: python -m mkdocs build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
